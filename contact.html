<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact | Evara Yoga</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>:root{--pink:#e85c9b;--purple:#6b367b;--deep:#3b2149;--line:#efdce7;--muted:#756976}*{box-sizing:border-box}body{margin:0;font-family:"DM Sans",sans-serif;background:linear-gradient(135deg,#fff7fb,#f4e4ee);color:#2d2030}.nav{padding:20px 7%;display:flex;justify-content:space-between}.brand{font:600 22px "Playfair Display";color:var(--purple);text-decoration:none}.nav a:last-child{color:var(--pink);text-decoration:none;font-weight:700}.wrap{max-width:980px;margin:auto;padding:50px 22px 90px}.intro{text-align:center;max-width:680px;margin:auto}.eyebrow{font-size:11px;color:var(--pink);font-weight:700;letter-spacing:2px}.intro h1{font:500 clamp(46px,7vw,74px)/1 "Playfair Display";color:var(--deep);margin:12px}.intro p{color:var(--muted);line-height:1.7}.card{margin-top:35px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:32px;box-shadow:0 20px 50px #7b315f12;max-width:700px;margin-left:auto;margin-right:auto}label{display:block;font-size:12px;font-weight:700;margin:14px 0 6px}input,textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font:inherit}textarea{min-height:130px;resize:vertical}button{margin-top:18px;width:100%;padding:14px;border:0;border-radius:28px;background:linear-gradient(100deg,var(--purple),var(--pink));color:#fff;font-weight:700;cursor:pointer}.status{min-height:22px;margin-top:12px;font-size:13px}.error{color:#b42318}.success{color:#087443}</style></head>
<body><nav class="nav"><a class="brand" href="index.html">EVARA YOGA</a><a href="https://wa.me/919105144413">Book a Session</a></nav>
<main class="wrap"><section class="intro"><div class="eyebrow">LET'S TALK</div><h1>Start your yoga journey with us.</h1><p>Send your enquiry and the Evara Yoga team can follow up with the right class and availability.</p></section>
<form id="contactForm" class="card"><label>Name</label><input name="name" maxlength="120" required><label>Email</label><input name="email" type="email" maxlength="254" required><label>Phone</label><input name="phone" maxlength="40"><label>Message</label><textarea name="message" maxlength="5000" required></textarea><button>Send message</button><div id="status" class="status" aria-live="polite"></div></form></main>
<script type="module">import{api}from'./js/api.js';const f=document.querySelector('#contactForm'),s=document.querySelector('#status'),b=f.querySelector('button');f.addEventListener('submit',async e=>{e.preventDefault();b.disabled=true;s.textContent='Sending…';s.className='status';const d=new FormData(f);try{const r=await api('/contact',{method:'POST',body:JSON.stringify(Object.fromEntries(d))});f.reset();s.textContent=r.message||'Message received.';s.className='status success';}catch(err){s.textContent=err.message;s.className='status error';}finally{b.disabled=false;}});</script>
</body></html>
